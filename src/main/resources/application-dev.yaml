server:
  port: 80

spring:
  application:
    name: lv2-final-mission
  datasource:
    url: ${DEV_DATASOURCE_URL}
    username: ${DEV_DATASOURCE_USERNAME}
    password: ${DEV_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

name-generator:
  api:
    key: ${NAME_GENERATOR_API_KEY}

security:
  jwt:
    token:
      secret-key: ${TOKEN_SECRET_KEY}
      expire-length: 360000
